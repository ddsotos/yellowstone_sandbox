[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yellowstone-rl-bundle"
version = "0.1.0"
description = "Self-contained Yellowstone Park reinforcement-learning reference bundle."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
tensor = ["numpy>=2.0"]
cnn = ["numpy>=2.0", "torch>=2.0"]
value = ["numpy>=2.0", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
